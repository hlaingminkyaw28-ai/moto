services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moto_service_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - moto_service

  nginx:
    image: nginx:1.27-alpine
    container_name: moto_service_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - moto_service

  mysql:
    image: mysql:8.4
    container_name: moto_service_mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: moto_service
      MYSQL_USER: moto_user
      MYSQL_PASSWORD: moto_password
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - moto_service_mysql:/var/lib/mysql
    networks:
      - moto_service

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: moto_service_phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: moto_user
      PMA_PASSWORD: moto_password
    depends_on:
      - mysql
    networks:
      - moto_service

networks:
  moto_service:
    driver: bridge

volumes:
  moto_service_mysql:
